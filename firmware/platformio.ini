; ---------------------------------------------------------------------------
;  Smart Home OS - ESP32 Firmware
;  Target: ESP32 DevKit V1 (30-pin, ESP32-WROOM-32, 4 MB flash)
;  Build:  pio run -e esp32dev
;  Flash:  pio run -e esp32dev -t upload -t monitor
;  Tests:  pio test -e native
; ---------------------------------------------------------------------------

[platformio]
default_envs = esp32dev
src_dir      = src
include_dir  = include

; ------------------------- shared settings --------------------------------
[env]
monitor_speed    = 115200
monitor_filters  = esp32_exception_decoder, time
build_unflags    = -std=gnu++11

; ------------------------- ESP32 target -----------------------------------
[env:esp32dev]
; pioarduino, not platformio/espressif32. The official platform is frozen at
; arduino-esp32 2.x / IDF 4.4, where esp_mqtt still has the flat config struct,
; the cert bundle is a differently-named Arduino shim, and AsyncTCP 3.x is
; unsupported. This firmware targets arduino-esp32 3.x / IDF 5.x throughout.
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
framework = arduino
board     = esp32dev

board_build.partitions = partitions_4mb_ota.csv
board_build.filesystem = littlefs
board_build.f_cpu      = 240000000L

upload_speed = 921600

build_flags =
    -std=gnu++17
    -I src
    ; --- firmware identity (also reported to backend + used by OTA) ---
    -D SH_FW_VERSION=\"1.0.0\"
    -D SH_HW_REVISION=\"devkitv1-8ch\"
    ; --- log level: 0=None 1=Error 2=Warn 3=Info 4=Debug 5=Verbose ---
    -D SH_LOG_LEVEL=4
    ; --- keep the mbedTLS record buffer small; saves ~28 KB heap (Loophole #26)
    -D MBEDTLS_SSL_MAX_CONTENT_LEN=4096
    ; --- ArduinoJson: no deprecated shims ---
    -D ARDUINOJSON_ENABLE_STD_STRING=0
    -D CORE_DEBUG_LEVEL=1
    ; --- ESPAsyncWebServer: enables the regex routes used by /api/relay/<n> ---
    -D ASYNCWEBSERVER_REGEX=1

; MQTT is the ESP-IDF native client (esp_mqtt), which ships with the platform -
; PubSubClient cannot publish above QoS 0, which would silently downgrade every
; state report. Nothing to add here for it.
lib_deps =
    bblanchon/ArduinoJson @ ^7.3.0
    ESP32Async/AsyncTCP @ ^3.3.2
    ESP32Async/ESPAsyncWebServer @ ^3.7.0

; ------------------------- native logic tests -----------------------------
; Only pure, hardware-free logic is compiled here (Debouncer, press decoder,
; relay state machine, rule evaluator). No Arduino.h, no FreeRTOS.
[env:native]
platform  = native
test_framework = unity
build_flags =
    -std=gnu++17
    -I src
    -D SH_NATIVE_TEST=1
build_src_filter = -<*>

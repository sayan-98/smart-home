# ---------------------------------------------------------------------------
#  Local development broker only.
#
#  Anonymous access is enabled because this listens on your LAN during
#  development and adding credentials here buys nothing. DO NOT deploy this
#  configuration: production uses HiveMQ Cloud with per-device credentials and
#  per-device topic ACLs, so one leaked device cannot subscribe to '#' and
#  control every home.
# ---------------------------------------------------------------------------

listener 1883 0.0.0.0
protocol mqtt

# WebSocket listener, so a browser or the Capacitor app can subscribe directly
# while debugging.
listener 9001 0.0.0.0
protocol websockets

allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Retained messages are load-bearing here: they are how a client that connects
# later gets the current relay state without a round trip to the device.
max_queued_messages 1000
message_size_limit 65536
